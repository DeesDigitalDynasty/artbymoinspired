    <polygon points="400,710 435,710 455,920 400,920" fill="#15803D"/>
    <path d="M270,280 C270,110 530,110 530,280 C530,550 470,730 400,730 C330,730 270,550 270,280 Z" fill="#FAF8F5"/>
