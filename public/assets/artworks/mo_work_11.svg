<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <rect width="800" height="1000" fill="#FAF8F5"/>
  <!-- Horizontal Black Stripes -->
  <g stroke="#0A0A0A" stroke-width="10">
    <line x1="60" y1="180" x2="740" y2="180"/>
    <line x1="60" y1="300" x2="740" y2="300"/>
    <line x1="60" y1="420" x2="740" y2="420"/>
    <line x1="60" y1="540" x2="740" y2="540"/>
    <line x1="60" y1="660" x2="740" y2="660"/>
    <line x1="60" y1="780" x2="740" y2="780"/>
