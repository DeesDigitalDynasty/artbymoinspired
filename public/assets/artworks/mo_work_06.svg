<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="800" height="1050">
  <rect width="800" height="1050" fill="#FAF8F5"/>
  <!-- Horizontal background stripes -->
  <g stroke="#0A0A0A" stroke-width="5">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="260" x2="800" y2="260"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="540" x2="800" y2="540"/>
    <line x1="0" y1="680" x2="800" y2="680"/>
    <line x1="0" y1="820" x2="800" y2="820"/>
    <line x1="0" y1="960" x2="800" y2="960"/>
  </g>
  <!-- Left Face -->
  <g transform="translate(55, 80)">
    <path d="M30,220 C30,60 310,60 310,220 C310,450 250,580 170,580 C90,580 30,450 30,220 Z" fill="#FAF8F5" stroke="#0A0A0A" stroke-width="7"/>
    <path d="M40,175 Q170,70 300,175 Z" fill="#E31C25" stroke="#0A0A0A" stroke-width="6"/>
    <!-- Green Eyelids -->
    <path d="M55,245 Q105,205 145,245 Z" fill="#14942C" stroke="#0A0A0A" stroke-width="5"/>
    <path d="M195,245 Q245,205 285,245 Z" fill="#14942C" stroke="#0A0A0A" stroke-width="5"/>
    <!-- Teardrops -->
    <path d="M95,275 C90,295 110,295 105,275 Z" fill="#0A0A0A"/>
    <!-- Geometric Red & Black Lips -->
    <polygon points="115,465 170,440 225,465 170,495" fill="#E31C25" stroke="#0A0A0A" stroke-width="5"/>
  </g>
  <!-- Right Face -->
  <g transform="translate(405, 290)">
    <path d="M30,220 C30,60 310,60 310,220 C310,450 250,580 170,580 C90,580 30,450 30,220 Z" fill="#FAF8F5" stroke="#0A0A0A" stroke-width="7"/>
    <path d="M40,175 Q170,70 300,175 Z" fill="#1D4ED8" stroke="#0A0A0A" stroke-width="6"/>
    <!-- Green Eyelids -->
    <path d="M55,245 Q105,205 145,245 Z" fill="#14942C" stroke="#0A0A0A" stroke-width="5"/>
    <path d="M195,245 Q245,205 285,245 Z" fill="#14942C" stroke="#0A0A0A" stroke-width="5"/>
    <!-- Teardrops -->
    <path d="M240,275 C235,295 255,295 250,275 Z" fill="#0A0A0A"/>
    <!-- Geometric Red & Black Lips -->
    <polygon points="115,465 170,440 225,465 170,495" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="5"/>
  </g>
</svg>
